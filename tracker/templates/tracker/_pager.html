{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a class="button" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">&larr; Prev</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} rows)</span>
  {% if page.has_next %}<a class="button" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next &rarr;</a>{% endif %}
</div>
{% endif %}
