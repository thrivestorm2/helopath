{# Round Facebook / Instagram icons linking to the pages set on {{ obj }} (drawn inline: no outside images). #}
{% for field, name, url in obj.social_links %}<a class="social-icon social-{{ field }}" href="{{ url }}" target="_blank" rel="noopener noreferrer" title="{{ obj }} on {{ name }}" aria-label="{{ obj }} on {{ name }}">{% if field == "facebook" %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.3H8v3h2.6V21z"/></svg>{% else %}<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16.3" cy="7.7" r="1.1" fill="#fff"/></svg>{% endif %}</a>{% endfor %}
