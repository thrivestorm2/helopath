# Runs the test suite on every pull request (and on main after merging). Needs no secrets.
# Deployment is separate: DigitalOcean App Platform watches main and deploys it (.do/app.yaml).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16  # official image via Google's Docker Hub mirror: no Hub pull rate limit
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (SQLite)
        run: python manage.py test tracker
      - name: Tests (PostgreSQL, as in production)
        run: python manage.py test tracker
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/helopath
      - name: Production image builds
        run: docker build -t helopath:ci .
